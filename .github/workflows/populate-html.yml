name: Populate compiled textbook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/populate-html.yml'
      - 'tools/prepare_static_site.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: populate-compiled-textbook
  cancel-in-progress: false

jobs:
  compile-and-store:
    if: github.repository == 'sonyyt/EdgeComputingBook-HTML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out HTML destination
        uses: actions/checkout@v6
        with:
          ref: main
          path: target
          persist-credentials: true

      - name: Read the exact approved source snapshot
        uses: actions/checkout@v6
        with:
          repository: sonyyt/EdgeComputingBook
          ref: aac9a7f88348df9e149447a2ad2916dbf8125d1e
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the tested Sphinx dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Build all chapters and appendices
        working-directory: source
        run: >-
          python -m sphinx -E -a -n -W --keep-going -b html
          -D html_baseurl=https://sonyyt.github.io/EdgeComputingBook-HTML/
          -D html_copy_source=0
          -D html_show_sourcelink=0
          -D html_context.github_version=main
          docs "$RUNNER_TEMP/book-html"

      - name: Validate and prepare the complete static site and ZIP
        run: python target/tools/prepare_static_site.py source "$RUNNER_TEMP/book-html" target

      - name: Commit the generated website files to the HTML repository
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html preface.html publication.html references.html search.html genindex.html chapters appendices _static _images searchindex.js objects.inv .nojekyll README.md LICENSE-SOURCE BUILD_REPORT.json FILES_SHA256.json downloads
          if git diff --cached --quiet; then
            echo 'The checked website files are already up to date.'
          else
            git commit -m 'Upload complete compiled English textbook v0.4.2 and ZIP snapshot'
            git push origin HEAD:main
          fi
          echo "Stored commit: $(git rev-parse HEAD)"
          echo 'Source repository, custom domain, DNS, and Pages settings were not modified.'
